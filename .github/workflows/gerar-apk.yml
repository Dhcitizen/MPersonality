name: Gerar APK

# Roda a cada envio (push) de código e também pode ser iniciado manualmente
# pela aba "Actions" do GitHub (botão "Run workflow").
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preparar a chave de assinatura (release)
        env:
          KEYSTORE_BASE64: ${{ secrets.MPERSONALITY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MPERSONALITY_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Chave encontrada: o APK release será assinado."
          else
            echo "::warning::Os Secrets da chave não estão configurados. Só o APK de debug será publicado."
          fi

      - name: Gerar APKs (debug e release)
        env:
          MPERSONALITY_KEYSTORE_PASSWORD: ${{ secrets.MPERSONALITY_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Organizar os APKs
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk saida/MPersonality-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk saida/MPersonality.apk
          fi
          ls -la saida

      - name: Guardar os APKs (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MPersonality-apks
          path: saida/*.apk
          retention-days: 30

      - name: Publicar os APKs na página de Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao saida/*.apk \
            --target "$GITHUB_SHA" \
            --title "MPersonality - última versão" \
            --notes "MPersonality.apk = versão rápida (release, use esta). MPersonality-debug.apk = versão de testes. Gerado em $(date -u '+%d/%m/%Y %H:%M') (UTC)."
