name: Gerar APK

# Roda a cada envio (push) de código e também pode ser iniciado manualmente
# pela aba "Actions" do GitHub (botão "Run workflow").
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gerar APK de debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MPersonality-debug.apk

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MPersonality-debug
          path: MPersonality-debug.apk
          retention-days: 30

      - name: Publicar o APK na página de Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao MPersonality-debug.apk \
            --target "$GITHUB_SHA" \
            --title "MPersonality - versão de teste" \
            --notes "APK gerado automaticamente em $(date -u '+%d/%m/%Y %H:%M') (UTC)."
